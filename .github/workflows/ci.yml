name: SER Plastik CI

concurrency:
  group: ser-plastik-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - premium-mimi-v1
  pull_request:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block prohibited former-partner phone number
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '533[[:space:]-]*666[[:space:]-]*73[[:space:]-]*99|905336667399' . \
            --exclude-dir=.git \
            --exclude='package-lock.json'; then
            echo "ERROR: prohibited phone number found in repository content."
            exit 1
          fi

      - name: Verify approved mobile number is wired
        shell: bash
        run: |
          set -euo pipefail
          grep -RIlE '905336667381|\+90 533 666 73 81' src chat-backend public >/dev/null

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check leads.js
          node --check mailer.js
          node --check intents/intentDetector.js
          node --check ai/openai.js
